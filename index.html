<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For Samaira ❤️</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<style>
body{
margin:0;
height:100vh;
background:linear-gradient(135deg,#ff4d6d,#ff8fa3);
overflow:hidden;
font-family:Arial,sans-serif;
display:flex;
justify-content:center;
align-items:center;
text-align:center;
}
.container{color:white;z-index:2;}
h1{font-size:2.2em;}
button{
margin:10px;
padding:14px 35px;
font-size:1.1em;
border:none;
border-radius:40px;
cursor:pointer;
}
#yes{background:white;color:#ff4d6d;}
#no{background:#ffd6dc;color:#ff4d6d;position:absolute;}
.heart{
position:absolute;
font-size:20px;
animation:float 6s linear infinite;
}
@keyframes float{
0%{transform:translateY(100vh);opacity:1;}
100%{transform:translateY(-10vh);opacity:0;}
}
</style>
</head>
<body onclick="playMusic()">

<audio id="music" loop>
<source src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3" type="audio/mpeg">
</audio>

<div class="container">
<h1>Samaira ❤️</h1>
<h1>Will you be my Valentine? 💘</h1>
<button id="yes" onclick="alert('Yayyy ❤️🥰 Sehaj is smiling 😏🔥')">YES 😍</button>
<button id="no" onmouseover="moveNo()">NO 😒</button>
</div>

<script>
function heart(){
let h=document.createElement("div");
h.className="heart";
h.innerHTML="❤️";
h.style.left=Math.random()*100+"vw";
h.style.fontSize=(15+Math.random()*20)+"px";
document.body.appendChild(h);
setTimeout(()=>h.remove(),6000);
}
setInterval(heart,300);

function moveNo(){
let n=document.getElementById("no");
n.style.left=Math.random()*80+"vw";
n.style.top=Math.random()*80+"vh";
}
function playMusic(){
document.getElementById("music").play();
}
</script>

</body>
</html>
